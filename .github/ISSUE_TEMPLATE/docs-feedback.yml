name: Documentation feedback
description: Suggest a correction or improvement to the checklist, scenarios, or templates.
labels: ["docs"]
body:
  - type: markdown
    attributes:
      value: |
        REA Research Labs, Inc. maintainers review issues. Response times are not guaranteed. Use public issues only for non-sensitive documentation feedback; do not include secrets, private data, vulnerabilities or exploit details. For sensitive reports, use private vulnerability reporting as described in SECURITY.md.
  - type: input
    id: file
    attributes:
      label: File or section
      placeholder: docs/checklist.md, section 5
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is unclear, missing, or wrong?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested change (optional)
